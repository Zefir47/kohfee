<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Kohfee — кошик</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">KOHFEE</div>
    <nav>
      <ul>
        <li><a href="index.html">Головна</a></li>
        <li><a href="promo.html">Акції</a></li>
        <li><a href="delivery.html">Доставка</a></li>
        <li><a href="reviews.html">Відгуки</a></li>
        <li><a href="about.html">Про нас</a></li>
      </ul>
    </nav>
    <div class="header-icons">
      <a href="profile.html">Профіль</a>
      <a href="cart.html" class="cart-icon active">Кошик <span class="cart-count" id="cart-count">2</span></a>
    </div>
  </div>
</header>

<div class="container">
  <h2 class="section-title">Кошик</h2>
  <div class="two-col">

    <div class="box">
      <table>
        <thead>
          <tr><th>Товар</th><th>Ціна</th><th>К-сть</th><th>Разом</th><th></th></tr>
        </thead>
        <tbody>
          <tr>
            <td>Ефіопія Sidamo / 250г</td><td>320 грн</td><td>1</td><td>320 грн</td>
            <td><button class="remove-btn" title="Видалити">✕</button></td>
          </tr>
          <tr>
            <td>Еспресо Бленд / 250г</td><td>250 грн</td><td>2</td><td>500 грн</td>
            <td><button class="remove-btn" title="Видалити">✕</button></td>
          </tr>
        </tbody>
      </table>
      <p style="text-align:right; margin-top:14px; font-weight:700;">Сума: 820 грн</p>
    </div>

    <div class="box">
      <h3 style="margin-top:0;">Інформація для доставки</h3>
      <label for="name">Ім'я та прізвище</label>
      <input type="text" id="name" placeholder="Іван Іваненко">
      <label for="phone">Телефон</label>
      <input type="text" id="phone" placeholder="+380">
      <label for="address">Адреса доставки</label>
      <input type="text" id="address" placeholder="Місто, вулиця, будинок">
      <label for="pay">Спосіб оплати</label>
      <select id="pay">
        <option>Оплата карткою онлайн</option>
        <option>Оплата при отриманні</option>
      </select>
      <button style="width:100%;" onclick="alert('Замовлення оформлено (демо)')">Оформити замовлення</button>
    </div>

  </div>
</div>

<footer>
  <div class="brand">KOHFEE</div>
  <div>+38 (099) 111 22 33 · support@kohfee.com</div>
  <div>м. Київ, вул. Кавова, 12</div>
</footer>

<script src="script.js"></script>
</body>
</html>
